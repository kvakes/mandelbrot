<!DOCTYPE html>
<html>
<head>
  <title>Buddhabrot</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
    }
    header {
      position: absolute;
      left: 0;
      top: 0;
    }
    canvas {
      display: block;
      height: 100vh;
      width: 100vw;
      background: #000;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div>
    <header>
      <span id="pan"></span>
      <span id="zoom"></span>
    </header>
    <canvas></canvas>
  </div>

  <script>
  (function() {
    var c = document.getElementsByTagName('canvas')[0];
    var ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;

    // Mandlebrot Test
    var maxIterations = 100;
    var threshold = 50;
    function whenDiverges(r, i) {
      var origR = r;
      var origI = i;

      var x, tempR, tempI;

      for (x = 0; x <= maxIterations; x++) {
        var absolute = Math.sqrt(Math.pow(r, 2) + Math.pow(i, 2));
        if (absolute > threshold) {
          break;
        }

        tempR = Math.pow(r, 2) - Math.pow(i, 2) + origR;
        tempI = 2 * r * i + origI;

        r = tempR;
        i = tempI;
      }

      return x;
    }

    var aw = c.offsetWidth;
    var ah = c.offsetHeight;
    var start = [aw / 2, ah / 2];

    // Params
    var pan = [0, 0];
    var zoom = 100;

    // Drawing
    function draw() {
      var pixels = [];
      var minIteration = null;
      var maxIteration = null;

      for (var xc = 0; xc < aw; xc++) {
        pixels[xc] = [];
        for (var yc = 0; yc < ah; yc++) {
          var pixel = [xc, yc];
          var pixelRelativeToStart = [pixel[0] - start[0], pixel[1] - start[1]];
          var zoomedCoordinate = [pixelRelativeToStart[0] / zoom, pixelRelativeToStart[1] / zoom];
          var panned = [zoomedCoordinate[0] - pan[0], zoomedCoordinate[1] - pan[1]];

          var iteration = whenDiverges(panned[0], panned[1]);
          pixels[xc][yc] = iteration;

          if (minIteration === null) {
            minIteration = iteration;
          } else {
            minIteration = Math.min(minIteration, iteration);
          }
          if (maxIteration === null) {
            maxIteration = iteration;
          } else {
            maxIteration = Math.max(maxIteration, iteration);
          }
        }
      }

      for (var p = 0; p < pixels.length; p++) {
        for (var s = 0; s < pixels[p].length; s++) {
          var hsl = [0, 100, 50];
          if (pixels[p][s] >= maxIterations) {
            hsl[2] = 0;
          }
          hsl[0] = Math.round((pixels[p][s] - minIteration) / (maxIteration - minIteration) * 360);

          ctx.fillStyle = 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] +'%)';
          ctx.fillRect(p, s, 1, 1);
        }
      }
    }

    function update() {
      document.getElementById('pan').innerHTML = 'x: ' + pan[0] + ', y: ' + pan[1];
      document.getElementById('zoom').innerHTML = 'zoom: ' + zoom;
    }

    draw();
    update();

    // Zoom on click
    c.addEventListener('click', function (e) {
      pan = [(start[0] - e.x) / zoom + pan[0], (start[1] - e.y) / zoom  + pan[1]];
      zoom = zoom * 10;
      maxIterations = Math.sqrt(Math.sqrt(zoom)) * 10 + 20;
      draw();
      update();
    });
  })();
  </script>
</body>
</html>
