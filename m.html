<!DOCTYPE html>
<html>
<head>
  <title>Buddhabrot</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
    }
    canvas {
      display: block;
      height: 100vh;
      width: 100vw;
      background: #000;
    }
  </style>
</head>
<body>

  <div>
    <canvas></canvas>
  </div>

  <script>
  (function() {
    var c = document.getElementsByTagName('canvas')[0];
    var ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;

    // Mandlebrot Test
    let maxIterations = 500;
    let threshold = 50;
    function whenDiverges(r, i) {
      var origR = r;
      var origI = i;

      var x, tempR, tempI;

      for (x = 0; x <= maxIterations; x++) {
        var absolute = Math.sqrt(Math.pow(r, 2) + Math.pow(i, 2));
        if (absolute > threshold) {
          break;
        }

        tempR = Math.pow(r, 2) - Math.pow(i, 2) + origR;
        tempI = 2 * r * i + origI;

        r = tempR;
        i = tempI;
      }

      return x;
    }

    var aw = c.offsetWidth;
    var ah = c.offsetHeight;
    var start = [aw / 2, ah / 2];

    // Params
    var pan = [0, 0];
    var zoom = 100;

    // Drawing
    for (var xc = 0; xc < aw; xc++) {
      for (var yc = 0; yc < ah; yc++) {
        var pixel = [xc, yc];
        var pixelRelativeToStart = [pixel[0] - start[0], pixel[1] - start[1]];
        var zoomedCoordinate = [pixelRelativeToStart[0] / zoom, pixelRelativeToStart[1] / zoom];
        var panned = [zoomedCoordinate[0] - pan[0], zoomedCoordinate[1] - pan[1]];

        var iteration = whenDiverges(panned[0], panned[1]);

        var hsl = [0, 100, 50];
        if (iteration >= maxIterations) {
          hsl[2] = 0;
        }
        hsl[0] = Math.round(360 - iteration / maxIterations * 360);

        ctx.fillStyle = 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] +'%)';
        ctx.fillRect(pixel[0], pixel[1], 1, 1);
      }
    }
  })();
  </script>
</body>
</html>
