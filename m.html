<!DOCTYPE html>
<html>
<head>
  <title>Buddhabrot</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
    }
    canvas {
      display: block;
      height: 100vh;
      width: 100vw;
      background: #000;
    }
  </style>
</head>
<body>

  <div>
    <canvas></canvas>
  </div>

  <script>
  (function() {
    var c = document.getElementsByTagName('canvas')[0];
    var ctx = c.getContext('2d');
    c.width = c.offsetWidth;
    c.height = c.offsetHeight;

    // Mandlebrot Test
    let maxIterations = 500;
    let threshold = 50;
    function whenDiverges(r, i) {
      var origR = r;
      var origI = i;

      var x, tempR, tempI;

      for (x = 0; x <= maxIterations; x++) {
        var absolute = Math.sqrt(Math.pow(r, 2) + Math.pow(i, 2));
        if (absolute > threshold) {
          break;
        }

        tempR = Math.pow(r, 2) - Math.pow(i, 2) + origR;
        tempI = 2 * r * i + origI;

        r = tempR;
        i = tempI;
      }

      return x;
    }

    // Params6
    var pan = [-0.75, -0.08];
    var magnification = 200000;
    var aw = c.offsetWidth;
    var ah = c.offsetHeight;
    var start = [c.offsetWidth / 2 - aw / 2, c.offsetHeight / 2 - ah / 2];

    // Drawing
    for (var xc = 0; xc < aw; xc++) {
      for (var yc = 0; yc < ah; yc++) {
        var hsl = [0, 100, 50];

        var r = pan[0] + xc / magnification;
        var i = pan[1] + yc / magnification;
        var iteration = whenDiverges(r, i);

        if (iteration >= maxIterations) {
          hsl[2] = 0;
        }

        hsl[0] = Math.round(360 - iteration / maxIterations * 360);

        ctx.fillStyle = 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] +'%)';
        ctx.fillRect(start[0] + xc, start[1] + yc, 1, 1);
      }
    }
  })();
  </script>
</body>
</html>
